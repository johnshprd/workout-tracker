  <!-- Inline SVG icon as base64 — works as both apple-touch-icon and manifest icon -->
  <script>
    (function(){
      // Build a 512x512 SVG icon: black bg, lime barbell + lightning bolt
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="96" fill="#0d0d0d"/>
        <!-- Barbell bar -->
        <rect x="96" y="236" width="320" height="40" rx="10" fill="#c8ff00"/>
        <!-- Left collar -->
        <rect x="96" y="196" width="32" height="120" rx="8" fill="#c8ff00"/>
        <!-- Right collar -->
        <rect x="384" y="196" width="32" height="120" rx="8" fill="#c8ff00"/>
        <!-- Left weight plate outer -->
        <rect x="44" y="170" width="52" height="172" rx="12" fill="#c8ff00"/>
        <!-- Left weight plate inner cutout -->
        <rect x="56" y="186" width="28" height="140" rx="6" fill="#0d0d0d"/>
        <!-- Right weight plate outer -->
        <rect x="416" y="170" width="52" height="172" rx="12" fill="#c8ff00"/>
        <!-- Right weight plate inner cutout -->
        <rect x="428" y="186" width="28" height="140" rx="6" fill="#0d0d0d"/>
        <!-- Lightning bolt overlay (centre) -->
        <polygon points="272,148 228,272 258,272 240,364 296,228 262,228 284,148" fill="#0d0d0d"/>
      </svg>`;
      const b64 = btoa(svg);
      const url = `data:image/svg+xml;base64,${b64}`;

      // Apple touch icon
      const link = document.createElement("link");
      link.rel = "apple-touch-icon";
      link.href = url;
      document.head.appendChild(link);

      // Favicon
      const fav = document.createElement("link");
      fav.rel = "icon"; fav.type = "image/svg+xml"; fav.href = url;
      document.head.appendChild(fav);

      // PWA manifest
      const manifest = {
        name: "Workout Log",
        short_name: "Workout",
        start_url: ".",
        display: "standalone",
        background_color: "#0d0d0d",
        theme_color: "#0d0d0d",
        icons: [
          { src: url, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      const mBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
      const mUrl = URL.createObjectURL(mBlob);
      const mLink = document.createElement("link");
      mLink.rel = "manifest"; mLink.href = mUrl;
      document.head.appendChild(mLink);
    })();
  </script>

<div id="app"></div>
<script>

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTick() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine"; osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.07);
  } catch(e) {}
}
function playGetReady() {
  try {
    const ctx = getAudioCtx();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 4);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 300; bp.Q.value = 1.2;
    const gain = ctx.createGain(); gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    src.connect(bp); bp.connect(gain); gain.connect(ctx.destination); src.start(ctx.currentTime);
  } catch(e) {}
}
function playFinish() {
  try {
    const ctx = getAudioCtx();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination); osc.type = "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      const t = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.35);
    });
  } catch(e) {}
}

};

function setState(patch) {
  if (patch.timer) patch.timer = Object.assign({}, state.timer, patch.timer);
  Object.assign(state, patch);
  render();
}

// ── Build full exercise map (default + library + custom) ──────────────────────
function allExercises() {
  const map = {};
  DEFAULT_ROUTINE.forEach(e => { map[e.id] = e; });
  LIBRARY.forEach(e => { map[e.id] = e; });
  state.custom.forEach(e => { map[e.id] = e; });
  return map;
}
function getExercise(id) { return allExercises()[id] || { id, name:id, cat:"Custom", hasWeight:false, isTime:false }; }
function getIcon(id) {
  if (DEFAULT_ICONS[id]) return DEFAULT_ICONS[id];
  const ex = getExercise(id);
  return GENERIC_ICON(ex.cat);
}

// ── Timer ─────────────────────────────────────────────────────────────────────
function timerStart() {
  const secs = parseInt(state.timer.duration);
  if (!secs || secs <= 0) return;
  clearInterval(state.timer.intervalId);
  setState({ timer: { countdown:10, remaining:null, running:false, finished:false } });
  const intervalId = setInterval(() => {
    const t = state.timer;
    if (t.countdown !== null && t.countdown > 1) { playGetReady(); setState({ timer:{ countdown:t.countdown-1 } }); return; }
    if (t.countdown !== null && t.countdown <= 1) { playGetReady(); setState({ timer:{ countdown:null, remaining:secs, running:true } }); return; }
    if (t.remaining > 1) { playTick(); setState({ timer:{ remaining:t.remaining-1 } }); }
    else { clearInterval(t.intervalId); playFinish(); setState({ timer:{ remaining:0, running:false, finished:true, intervalId:null } }); }
  }, 1000);
  setState({ timer:{ intervalId } });
}
function timerPause() {
  const t = state.timer;
  if (t.running) { clearInterval(t.intervalId); setState({ timer:{ running:false, intervalId:null } }); }
  else if (t.remaining !== null && !t.finished) {
    const intervalId = setInterval(() => {
      const t2 = state.timer;
      if (t2.remaining > 1) { playTick(); setState({ timer:{ remaining:t2.remaining-1 } }); }
      else { clearInterval(t2.intervalId); playFinish(); setState({ timer:{ remaining:0, running:false, finished:true, intervalId:null } }); }
    }, 1000);
    setState({ timer:{ running:true, intervalId } });
  }
}
function timerReset() { clearInterval(state.timer.intervalId); setState({ timer:{ remaining:null, running:false, finished:false, countdown:null, intervalId:null } }); }
function setTimerDuration(v) { setState({ timer:{ duration:v } }); }
function setPreset(s) { setState({ timer:{ duration:String(s) } }); }

// ── Exercises ─────────────────────────────────────────────────────────────────
function getLastSet(id) {
  const dates = Object.keys(state.logs).sort((a,b) => b.localeCompare(a));
  for (const d of dates) { const sets = (state.logs[d]||{})[id]; if (sets && sets.length) return sets[sets.length-1]; }
  return null;
}
function openExercise(id) {
  if (state.activeEx === id) { setState({ activeEx:null, currentReps:"", currentKg:"", currentTime:"" }); return; }
  const prev = getLastSet(id);
  setState({ activeEx:id, currentReps:prev&&prev.reps!=null?String(prev.reps):"", currentKg:prev&&prev.weight!=null?String(prev.weight):"", currentTime:prev&&prev.time!=null?String(prev.time):"" });
}
function addSet() {
  const { activeEx, logs } = state;
  if (!activeEx) return;
  const ex = getExercise(activeEx);
  const set = {};
  if (ex.isTime) { if (!state.currentTime) return; set.time = state.currentTime; }
  else { if (!state.currentReps) return; set.reps = parseInt(state.currentReps); if (ex.hasWeight && state.currentKg) set.weight = parseFloat(state.currentKg); }
  const today = todayStr();
  const tl = logs[today] || {};
  const newSets = [...(tl[activeEx]||[]), set];
  const newLogs = { ...logs, [today]:{ ...tl, [activeEx]:newSets } };
  saveLogs(newLogs);
  setState({ logs:newLogs, currentReps:set.reps!=null?String(set.reps):"", currentKg:set.weight!=null?String(set.weight):"", currentTime:set.time!=null?String(set.time):"" });
}
function removeSet(id, i) {
  const today = todayStr(); const tl = state.logs[today]||{};
  const newSets = (tl[id]||[]).filter((_,idx)=>idx!==i);
  const newLogs = { ...state.logs, [today]:{ ...tl, [id]:newSets } };
  saveLogs(newLogs); setState({ logs:newLogs });
}
function formatSet(set, id) {
  const ex = getExercise(id);
  if (ex.isTime) return `${set.time}s`;
  let s = `${set.reps} reps`; if (set.weight) s += ` @ ${set.weight}kg`; return s;
}

  const routine = state.routine.filter(x=>x!==id); saveRoutine(routine);

// ── Progress computations ─────────────────────────────────────────────────────
function getStreak() {
  const dates = Object.keys(state.logs).filter(d => {
    const dl = state.logs[d];
    return Object.values(dl).some(s => s.length > 0);
  }).sort((a,b) => b.localeCompare(a));
  if (!dates.length) return { current: 0, best: 0 };
  let current = 0, best = 0, streak = 0;
  const today = todayStr();
  const msDay = 86400000;
  // current streak
  let check = today;
  for (let i = 0; i < 365; i++) {
    if (dates.includes(check)) { current++; }
    else if (check === today) { /* didn't work out today yet — don't break */ }
    else break;
    const d = new Date(check + "T12:00:00"); d.setDate(d.getDate() - 1);
    check = d.toISOString().split("T")[0];
  }
  // best streak
  let run = 1;
  for (let i = 1; i < dates.length; i++) {
    const a = new Date(dates[i-1]+"T12:00:00"), b = new Date(dates[i]+"T12:00:00");
    if ((a - b) === msDay) { run++; best = Math.max(best, run); }
    else { run = 1; }
  }
  best = Math.max(best, current, dates.length > 0 ? 1 : 0);
  return { current, best };
}

function getLast7Days() {
  const result = [];
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const str = d.toISOString().split("T")[0];
    const dl = state.logs[str] || {};
    const worked = Object.values(dl).some(s => s.length > 0);
    result.push({ str, day: days[d.getDay()], worked, isToday: i === 0 });
  }
  return result;
}

function getPersonalBests() {
  const pbs = {};
  for (const [date, dl] of Object.entries(state.logs)) {
    for (const [id, sets] of Object.entries(dl)) {
      const ex = getExercise(id);
      for (const set of sets) {
        if (!pbs[id]) pbs[id] = { reps: 0, weight: 0, time: 0, repDate:"", weightDate:"", timeDate:"" };
        if (ex.isTime && set.time && parseInt(set.time) > pbs[id].time) { pbs[id].time = parseInt(set.time); pbs[id].timeDate = date; }
        if (!ex.isTime && set.reps && set.reps > pbs[id].reps) { pbs[id].reps = set.reps; pbs[id].repDate = date; }
        if (set.weight && set.weight > pbs[id].weight) { pbs[id].weight = set.weight; pbs[id].weightDate = date; }
      }
    }
  }
  return pbs;
}

function getVolumeData(exId) {
  const ex = getExercise(exId);
  const points = [];
  const dates = Object.keys(state.logs).sort((a,b) => a.localeCompare(b)).slice(-14);
  for (const date of dates) {
    const sets = (state.logs[date] || {})[exId] || [];
    if (!sets.length) continue;
    let vol = 0;
    if (ex.isTime) { vol = sets.reduce((s, x) => s + (parseInt(x.time)||0), 0); }
    else if (ex.hasWeight) { vol = sets.reduce((s, x) => s + ((x.reps||0) * (x.weight||1)), 0); }
    else { vol = sets.reduce((s, x) => s + (x.reps||0), 0); }
    const label = new Date(date+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    points.push({ date, label, vol });
  }
  return points;
}

function drawBarChart(points, unit) {
  if (!points.length) return `<div class="chart-empty">No data yet for this exercise.</div>`;
  const W = 320, H = 100, pad = 8, barGap = 4;
  const max = Math.max(...points.map(p => p.vol)) || 1;
  const bw = (W - pad*2 - barGap * (points.length - 1)) / points.length;
  let bars = "", labels = "", values = "";
  points.forEach((p, i) => {
    const bh = Math.max(4, ((p.vol / max) * (H - 24)));
    const x = pad + i * (bw + barGap);
    const y = H - bh - 16;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="#c8ff00" opacity="0.85"/>`;
    labels += `<text x="${(x + bw/2).toFixed(1)}" y="${H}" font-size="8" fill="#555" text-anchor="middle" font-family="monospace">${p.label}</text>`;
    values += `<text x="${(x + bw/2).toFixed(1)}" y="${(y - 3).toFixed(1)}" font-size="8" fill="#c8ff00" text-anchor="middle" font-family="monospace">${p.vol}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H+4}" width="100%" style="display:block">${bars}${values}${labels}</svg><div style="font-size:10px;color:#444;text-align:right;margin-top:2px">${unit}</div>`;
}

function renderProgress() {
  const { logs, chartEx, routine } = state;
  const streak = getStreak();
  const last7 = getLast7Days();
  const pbs = getPersonalBests();
  const today = todayStr();

  // Streak card
  const weekDots = last7.map(d => `
    <div class="week-cell">
      <div class="week-dot${d.worked?" done":d.isToday?" today-empty":""}"></div>
      <div class="week-day${d.isToday?" today":""}">${d.day}</div>
    </div>`).join("");
  const streakHTML = `<div class="streak-card">
    <div class="streak-top">
      <div style="font-size:44px;line-height:1">🔥</div>
      <div class="streak-num">${streak.current}</div>
      <div class="streak-info">
        <div class="streak-label">Day Streak</div>
        <div class="streak-best">Best: ${streak.best} days</div>
        <div class="streak-best">${Object.keys(logs).filter(d=>Object.values(logs[d]).some(s=>s.length)).length} total sessions</div>
      </div>
    </div>
    <div class="week-grid">${weekDots}</div>
  </div>`;

  // Personal bests
  const pbEntries = Object.entries(pbs).filter(([id]) => routine.includes(id));
  let pbHTML = "";
  if (!pbEntries.length) { pbHTML = `<div class="empty" style="margin-top:10px;margin-bottom:10px">Log some sets to see personal bests.</div>`; }
  else {
    pbHTML = pbEntries.map(([id, pb]) => {
      const ex = getExercise(id);
      let val, unit, date;
      if (ex.isTime) { val = pb.time; unit = "sec"; date = pb.timeDate; }
      else if (ex.hasWeight) { val = pb.weight; unit = "kg"; date = pb.weightDate; }
      else { val = pb.reps; unit = "reps"; date = pb.repDate; }
      if (!val) return "";
      const dateStr = date ? new Date(date+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "";
      return `<div class="pb-card">
        <div class="pb-left"><div class="pb-name">${ex.name}</div><div class="pb-date">${dateStr}</div></div>
        <div><div class="pb-val">${val}</div><div class="pb-unit">${unit}</div></div>
      </div>`;
    }).join("");
  }

  // Volume chart
  const exWithData = routine.filter(id => {
    return Object.values(logs).some(dl => (dl[id]||[]).length > 0);
  });
  const selEx = exWithData.includes(chartEx) ? chartEx : (exWithData[0] || routine[0] || "PU");
  const exBtns = exWithData.slice(0, 8).map(id =>
    `<button class="chart-ex-btn${id===selEx?" active":""}" onclick="setState({chartEx:'${id}'})">${getExercise(id).name}</button>`
  ).join("");
  const pts = getVolumeData(selEx);
  const ex = getExercise(selEx);
  const unit = ex.isTime ? "total seconds" : ex.hasWeight ? "total volume (reps × kg)" : "total reps";
  const chartBody = exBtns ? `<div class="chart-ex-select">${exBtns}</div>${drawBarChart(pts, unit)}` : `<div class="chart-empty">Log some sets to see charts.</div>`;

  return `<div class="view">
    ${streakHTML}
    <div class="section-title">Personal Bests</div>
    ${pbHTML}
    <div class="chart-card">
      <div class="chart-title">Volume — Last 14 Days</div>
      ${chartBody}
    </div>
  </div>`;
}
function render() {
  const app = document.getElementById("app");
  const { view, activeEx, logs, timer, routine, custom, libSearch, libCat, customForm } = state;
  const today = todayStr();
  const todayLogs = logs[today] || {};
  const dateStr = new Date().toLocaleDateString("en-GB",{ weekday:"long", day:"numeric", month:"long" });

  // ── Timer HTML ──
  const circ = 2*Math.PI*40;
  let pct = 100;
  if (timer.remaining !== null && timer.duration) pct = (timer.remaining/parseInt(timer.duration))*100;
  const sd = (pct/100)*circ;
  const rc = timer.finished?"#ff4444":(timer.countdown!==null?"#ff9900":timer.running?"#c8ff00":"#3a5000");
  let td, tc, tf;
  if (timer.countdown!==null){td=timer.countdown;tc="#ff9900";tf="30px";}
  else if(timer.finished){td="DONE";tc="#ff4444";tf="20px";}
  else if(timer.remaining!==null){td=timer.remaining;tc="#c8ff00";tf="26px";}
  else{td="--";tc="#333";tf="20px";}
  const cl = timer.countdown!==null?`<div class="countdown-overlay">GET READY...</div>`:timer.finished?`<div class="countdown-overlay" style="color:#ff4444">TIME'S UP!</div>`:"";
  const isIdle = timer.remaining===null && timer.countdown===null && !timer.finished;
  let timerCtrl;
  if(isIdle){ timerCtrl=`<input class="timer-input" type="number" placeholder="Seconds" value="${timer.duration}" oninput="setTimerDuration(this.value)" onkeydown="if(event.key==='Enter')timerStart()"/><div class="presets">${[30,45,60,90,120].map(s=>`<button class="preset-btn${timer.duration==s?' active':''}" onclick="setPreset(${s})">${s}s</button>`).join("")}</div><div class="timer-btns"><button class="btn-primary" onclick="timerStart()">START</button></div>`; }
  else if(timer.countdown!==null){ timerCtrl=`<div class="timer-btns"><button class="btn-ghost" onclick="timerReset()">CANCEL</button></div>`; }
  else{ timerCtrl=`<div class="timer-btns">${!timer.finished?`<button class="${timer.running?'btn-secondary':'btn-primary'}" onclick="timerPause()">${timer.running?"PAUSE":"RESUME"}</button>`:""}<button class="btn-ghost" onclick="timerReset()">RESET</button></div>`; }

  const timerHTML = `<div class="timer-card"><div class="timer-label">⏱ Countdown Timer</div><div class="timer-inner"><div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0"><div class="timer-ring-wrap"><svg width="90" height="90"><circle cx="45" cy="45" r="40" fill="none" stroke="#1e1e1e" stroke-width="5"/><circle cx="45" cy="45" r="40" fill="none" stroke="${rc}" stroke-width="5" stroke-dasharray="${sd} ${circ}" stroke-linecap="round" style="transition:stroke-dasharray 0.9s linear,stroke 0.3s"/></svg><div class="timer-text" style="font-size:${tf};color:${tc}">${td}</div></div>${cl}</div><div class="timer-controls">${timerCtrl}</div></div></div>`;

  // ── Today / Log view ──
  let logHTML = "";
  if (view === "log") {
    let cards = "";
    for (const id of routine) {
      const ex = getExercise(id);
      const doneSets = todayLogs[id] || [];
      const isActive = activeEx === id;
      let body = "";
      if (isActive) {
        const pills = doneSets.length ? `<div class="set-pills">${doneSets.map((s,i)=>`<div class="set-pill"><span class="pill-num">S${i+1}</span><span class="pill-val">${formatSet(s,id)}</span><span class="pill-del" onclick="removeSet('${id}',${i})">×</span></div>`).join("")}</div>` : "";
        let inputs;
        if (ex.isTime) { inputs=`<input class="input-reps" type="text" inputmode="decimal" placeholder="secs" value="${state.currentTime}" oninput="state.currentTime=this.value" onkeydown="if(event.key==='Enter')addSet()"/>`; }
        else { inputs=`<input class="input-reps" type="text" inputmode="decimal" placeholder="reps" value="${state.currentReps}" oninput="state.currentReps=this.value" onkeydown="if(event.key==='Enter')addSet()"/>${ex.hasWeight?`<input class="input-kg" type="text" inputmode="decimal" placeholder="kg" value="${state.currentKg}" oninput="state.currentKg=this.value" onkeydown="if(event.key==='Enter')addSet()"/>`:""}`; }
        body = `<div class="ex-body">${pills}<div class="input-row">${inputs}<button class="btn-addset" onclick="addSet()">+ SET</button></div></div>`;
      }
      cards += `<div class="ex-card${isActive?" active":""}"><div class="ex-header" onclick="openExercise('${id}')"><div class="ex-info"><span class="ex-icon">${getIcon(id)}</span><div><div class="ex-name">${ex.name}<span class="ex-code">${id}</span></div>${doneSets.length?`<div class="ex-sets-count">${doneSets.length} set${doneSets.length>1?"s":""} logged</div>`:""}</div></div><div class="ex-badge${doneSets.length?" done":""}">${doneSets.length||"+"}</div></div>${body}</div>`;
    }
    if (!routine.length) cards = `<div class="empty">No exercises in your routine.<br>Add some in the Routine tab.</div>`;
    logHTML = `<div class="view">${timerHTML}${cards}</div>`;
  }

  // ── History view ──
  let histHTML = "";
  if (view === "history") {
    const dates = Object.keys(logs).sort((a,b)=>b.localeCompare(a)).slice(0,14);
    let inner = "";
    if (!dates.length) { inner=`<div class="empty">No history yet.</div>`; }
    else {
      for (const date of dates) {
        const dl = logs[date]; const exs = Object.entries(dl).filter(([,s])=>s.length);
        if (!exs.length) continue;
        const isToday = date===today;
        const label = isToday?"Today":new Date(date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
        inner += `<div class="hist-date${isToday?" today":""}">${label}</div><div class="hist-card">${exs.map(([id,sets])=>`<div class="hist-row"><div class="hist-exname">${getExercise(id).name}</div><div class="hist-sets">${sets.map((s,i)=>`<div class="hist-set"><span class="hist-snum">S${i+1}</span> ${formatSet(s,id)}</div>`).join("")}</div></div>`).join("")}</div>`;
      }
    }
    histHTML = `<div class="view">${inner}</div>`;
  }

  // ── Routine / Library view ──
  let routineHTML = "";
  if (view === "routine") {
    const allEx = allExercises();
    // Current routine
    let routineItems = "";
    for (const id of routine) {
      const ex = getExercise(id);
      const isDefault = !!DEFAULT_ROUTINE.find(e=>e.id===id);
      routineItems += `<div class="routine-item"><div class="routine-left"><span class="ex-icon" style="width:28px;height:28px">${getIcon(id)}</span><div><span class="routine-name">${ex.name}</span><span class="routine-tag">${ex.cat}${ex.hasWeight?" · weighted":""}${ex.isTime?" · timed":""}</span></div></div><button class="btn-remove-routine" onclick="removeFromRoutine('${id}')" title="Remove">×</button></div>`;
    }
    if (!routine.length) routineItems = `<div class="empty" style="margin-top:10px">Routine is empty.</div>`;

    // Filter library
    const allLib = [...LIBRARY, ...custom];
    const filtered = allLib.filter(e => {
      const matchCat = libCat==="All" || e.cat===libCat;
      const matchQ = !libSearch || e.name.toLowerCase().includes(libSearch.toLowerCase());
      return matchCat && matchQ;
    });
    const catBtns = CATS.map(c=>`<button class="cat-btn${libCat===c?" active":""}" onclick="setState({libCat:'${c}'})">${c}</button>`).join("");
    let libItems = filtered.map(e => {
      const inR = routine.includes(e.id);
      return `<div class="lib-item${inR?" in-routine":""}"><div class="lib-left"><span class="ex-icon" style="width:28px;height:28px">${GENERIC_ICON(e.cat)}</span><div><div class="lib-name">${e.name}</div><div class="lib-meta"><span>${e.cat}</span>${e.hasWeight?`<span class="weighted">weighted</span>`:""}${e.isTime?`<span>timed</span>`:""}</div></div></div>${inR?`<button class="btn-remove-lib" onclick="removeFromRoutine('${e.id}')">Remove</button>`:`<button class="btn-add-lib" onclick="addToRoutine('${e.id}')">+ Add</button>`}</div>`;
    }).join("");
    if (!filtered.length) libItems = `<div class="empty" style="margin-top:16px">No exercises found.</div>`;

    // Custom form
    const customFormHTML = `<div class="add-custom"><div class="add-custom-title">+ Create Custom Exercise</div><div class="custom-row"><input class="custom-input" placeholder="Exercise name" value="${customForm.name}" oninput="state.customForm.name=this.value"/></div><div class="custom-row"><select class="custom-select" onchange="state.customForm.cat=this.value">${["Chest","Back","Legs","Arms","Shoulders","Core","Cardio","Custom"].map(c=>`<option value="${c}"${customForm.cat===c?" selected":""}>${c}</option>`).join("")}</select></div><div class="toggle-row"><button class="toggle-btn${customForm.hasWeight?" on":""}" onclick="state.customForm.hasWeight=!state.customForm.hasWeight;render()">⚖️ Weighted</button><button class="toggle-btn${customForm.isTime?" on":""}" onclick="state.customForm.isTime=!state.customForm.isTime;render()">⏱ Timed</button></div><button class="btn-save-custom" onclick="addCustomExercise()">ADD TO ROUTINE</button></div>`;

    routineHTML = `<div class="view">
      <div class="section-title">Your Routine (${routine.length})</div>
      ${routineItems}
      <div class="section-title" style="margin-top:18px">Exercise Library</div>
      <input class="search-bar" placeholder="Search exercises..." value="${libSearch}" oninput="setState({libSearch:this.value})"/>
      <div class="cat-filters">${catBtns}</div>
      ${libItems}
      <div class="section-title" style="margin-top:18px">Custom Exercise</div>
      ${customFormHTML}
    </div>`;
  }

  app.innerHTML = `
    <div class="header"><div class="header-title">WORKOUT LOG</div><div class="header-date">${dateStr}</div></div>
    <div class="tabs">
      <button class="tab-btn${view==="log"?" active":""}" onclick="setState({view:'log'})">Today</button>
      <button class="tab-btn${view==="history"?" active":""}" onclick="setState({view:'history'})">History</button>
      <button class="tab-btn${view==="progress"?" active":""}" onclick="setState({view:'progress'})">Progress</button>
      <button class="tab-btn${view==="routine"?" active":""}" onclick="setState({view:'routine'})">Routine</button>
    </div>
    ${view==="log"?logHTML:view==="history"?histHTML:view==="progress"?renderProgress():routineHTML}
  `;
}

render();
</script>
</body>
</html>
